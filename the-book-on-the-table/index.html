<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Book on the Table</title>
<meta name="description" content="Two one-shots, two writers, one man. Choose your reader.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<link rel="stylesheet" href="select.css">
</head>
<body class="select-screen">
<a class="skip" href="about.html">About these two books</a>
<main class="screen">
<h1>Choose your reader</h1>
<div class="slots" id="slots">
<a class="slot" href="the-night-ledger.html" data-i="0"><img src="pages/nl/select.webp" alt="Emil, the night clerk of The Night Ledger, standing in the post office sorting room at night, hugging his gray ledger to his chest."><div class="plate"><div class="choice"><span class="cursor" aria-hidden="true">&#9654;</span>Trust the book</div><div class="which">The Night Ledger, a story by 5.5</div></div></a>
<a class="slot" href="rule-three.html" data-i="1"><img src="pages/rt/select.webp" alt="The man of Rule Three standing in his kitchen in morning light, a notebook held to his chest, looking warily to one side."><div class="plate"><div class="choice"><span class="cursor" aria-hidden="true">&#9654;</span>Check the handwriting</div><div class="which">Rule Three, a story by Muse</div></div></a>
</div>
<p class="ask">Two writers, the same night, the same man. A book you cannot remember writing is waiting on the table.</p>
<div class="foot">not for commercial use &middot; <a href="about.html">about</a></div>
</main>
<script>
(function(){
  var box=document.getElementById('slots'), slots=[].slice.call(box.querySelectorAll('.slot'));
  function pick(i){ slots.forEach(function(s,j){ s.classList.toggle('active', j===i); }); box.classList.add('has-focus'); }
  function clear(){ slots.forEach(function(s){ s.classList.remove('active'); }); box.classList.remove('has-focus'); }
  slots.forEach(function(s,i){
    s.addEventListener('focus', function(){ pick(i); });
    s.addEventListener('blur', function(){ setTimeout(function(){ if(!box.contains(document.activeElement)) clear(); },0); });
    s.addEventListener('touchstart', function(e){ if(!s.classList.contains('active')){ e.preventDefault(); pick(i); } }, {passive:false});
  });
  document.addEventListener('keydown', function(e){
    var cur=slots.findIndex(function(s){ return s.classList.contains('active'); });
    if(e.key==='ArrowRight'||e.key==='ArrowDown'){ e.preventDefault(); slots[cur<0?0:Math.min(cur+1,1)].focus(); }
    if(e.key==='ArrowLeft'||e.key==='ArrowUp'){ e.preventDefault(); slots[cur<0?0:Math.max(cur-1,0)].focus(); }
  });
})();
</script>
</body>
</html>
